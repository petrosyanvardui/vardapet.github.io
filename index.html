/* LANGUAGE SWITCHING */

let currentLanguage = "de";

function setLanguage(lang) {

  if (!translations[lang]) return;

  currentLanguage = lang;

  document.documentElement.lang = lang;

  document.querySelectorAll("[data-key]").forEach(el => {

    const key = el.dataset.key;

    if (translations[lang][key] !== undefined) {

      el.textContent = translations[lang][key];

    }

  });

  document.querySelectorAll("[data-lang]").forEach(btn => {

    btn.setAttribute(

      "aria-pressed",

      String(btn.dataset.lang === lang)

    );

  });

  const activeSection = location.hash.slice(1);

  if (allowedSections.has(activeSection)) {

    renderModal(activeSection);

  }

}

document.querySelectorAll("[data-lang]").forEach(btn => {

  btn.addEventListener("click", () => {

    setLanguage(btn.dataset.lang);

  });

});

/* POP-UP SYSTEM */

const allowedSections = new Set([

  "about",

  "portfolio",

  "research",

  "collaborations",

  "contact",

  "impressum",

  "privacy"

]);

const overlay = document.getElementById("overlay");

const modal = document.getElementById("modal");

const modalTitle = document.getElementById("modal-title");

const modalContent = document.getElementById("modal-content");

const closeButton = document.getElementById("modal-close");

let previousFocus = null;

function renderModal(section) {

  if (!allowedSections.has(section)) return;

  const language = translations[currentLanguage];

  if (section === "impressum") {

    modalTitle.textContent = "IMPRESSUM";

    modalContent.innerHTML = impressum;

    return;

  }

  if (section === "privacy") {

    modalTitle.textContent = language.privacy;

    modalContent.innerHTML = privacy;

    return;

  }

  modalTitle.textContent = language[section];

  modalContent.innerHTML =

    language[section + "Body"] || "";

  if (section === "contact") {

    modalContent.innerHTML += contactLinks;

  }

}

function openModal(section) {

  if (!allowedSections.has(section)) return;

  if (overlay.hidden) {

    previousFocus = document.activeElement;

  }

  renderModal(section);

  overlay.hidden = false;

  document.body.classList.add("modal-open");

  modal.scrollTop = 0;

  closeButton.focus();

}

function closeModal() {

  overlay.hidden = true;

  document.body.classList.remove("modal-open");

  if (previousFocus &&

      typeof previousFocus.focus === "function") {

    previousFocus.focus();

  }

}

function syncHash() {

  const section = decodeURIComponent(

    location.hash.slice(1)

  );

  if (allowedSections.has(section)) {

    openModal(section);

  } else {

    closeModal();

  }

}

function navigateHome() {

  history.pushState(

    null,

    "",

    location.pathname + location.search

  );

  closeModal();

}

closeButton.addEventListener("click", navigateHome);

overlay.addEventListener("click", event => {

  if (event.target === overlay) {

    navigateHome();

  }

});

document.addEventListener("keydown", event => {

  if (overlay.hidden) return;

  if (event.key === "Escape") {

    navigateHome();

  }

  if (event.key === "Tab") {

    const focusable = Array.from(

      modal.querySelectorAll(

        'a[href], button:not([disabled])'

      )

    ).filter(el => el.getClientRects().length);

    if (!focusable.length) return;

    const first = focusable[0];

    const last = focusable[focusable.length - 1];

    if (event.shiftKey &&

        document.activeElement === first) {

      event.preventDefault();

      last.focus();

    } else if (

      !event.shiftKey &&

      document.activeElement === last

    ) {

      event.preventDefault();

      first.focus();

    }

  }

});

window.addEventListener("hashchange", syncHash);

window.addEventListener("popstate", syncHash);

document.getElementById("year").textContent =

  new Date().getFullYear();

setLanguage("de");

syncHash();

</script>
