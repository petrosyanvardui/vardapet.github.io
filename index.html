html {

button,

a {

}

button {

}

a {

  color: inherit;

}

/* LANGUAGE SWITCH */

.language-switch {

  position: fixed;

  z-index: 100;

  top: calc(23px + env(safe-area-inset-top));

  right: 24px;

  display: flex;

  align-items: center;

  gap: 15px;

}

.language-switch button {

  border: 0;

  background: none;

  color: #777;

  font-size: 11px;

  letter-spacing: .14em;

  padding: 7px 0;

  cursor: pointer;

}

.language-switch button.active {

  color: #fff;

  border-bottom: 1px solid #fff;

}

/* HOME */

.home {

  min-height: 100svh;

  padding: 100px 24px 55px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

.brand {

  display: flex;

  align-items: center;

  justify-content: center;

}

.brand img {

  height: auto;

.roles {

  text-transform: uppercase;

}

/* FIVE FLOATING THEMES */

.themes {

  width: min(100%, 850px);

  height: clamp(210px, 30vh, 320px);

  margin-top: clamp(25px, 5vh, 65px);

  flex-shrink: 0;

}

.theme-word {

  display: block;

  width: max-content;

  max-width: 52%;

  color: #d8d5d0;

  font-family: Georgia, "Times New Roman", serif;

  font-size: clamp(20px, 3vw, 34px);

  font-weight: normal;

  font-style: italic;

  line-height: 1.3;

  text-align: center;

  opacity: 0;

  pointer-events: none;

  animation-name: themeFade;

  animation-duration: 12s;

  animation-timing-function: ease-in-out;

  animation-iteration-count: infinite;

  animation-fill-mode: both;

}

.theme-word:nth-child(1) {

  top: 6%;

  left: 10%;

  animation-delay: 0s;

}

.theme-word:nth-child(2) {

  top: 23%;

  right: 10%;

  animation-delay: -.4s;

}

.theme-word:nth-child(3) {

  top: 44%;

  left: 33%;

  animation-delay: -.8s;

}

.theme-word:nth-child(4) {

  top: 69%;

  left: 8%;

  animation-delay: -1.2s;

}

.theme-word:nth-child(5) {

  top: 78%;

  right: 3%;

  font-size: clamp(18px, 2.5vw, 29px);

  animation-delay: -1.6s;

}

@keyframes themeFade {

  0% {

    opacity: 0;

  }

  15% {

    opacity: 1;

  }

  58% {

    opacity: 1;

  }

  80% {

    opacity: 0;

  }

  100% {

    opacity: 0;

  }

}

/* MAIN NAVIGATION */

.main-nav {

  margin-top: 35px;

  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  gap: 18px 28px;

  max-width: 800px;

}

.main-nav button {

  border: none;

  background: none;

  color: #eee;

  font-size: 11px;

  letter-spacing: .16em;

  cursor: pointer;

  padding: 8px 0;

  text-transform: uppercase;

  transition: color .2s;

}

.main-nav button:hover {

  color: #aaa;

}

.home-footer {

  margin-top: 50px;

  color: #656360;

  font-size: 10px;

  letter-spacing: .12em;

}

/* POP-UP OVERLAY */

.overlay {

  position: fixed;

  z-index: 50;

  inset: 0;

  display: none;

  overflow-y: auto;

  overscroll-behavior: contain;

  background: var(--bg);

  padding: 110px 24px 85px;

}

.overlay.open {

  display: block;

}

.overlay-content {

  max-width: 1050px;

  margin: 0 auto;

  animation: appear .35s ease both;

}

@keyframes appear {

  from {

    opacity: 0;

    transform: translateY(10px);

  }

  to {

    opacity: 1;

    transform: translateY(0);

  }

}

.close-overlay {

  position: fixed;

  z-index: 101;

  top: calc(65px + env(safe-area-inset-top));

  right: 25px;

  background: none;

  color: #ddd;

  border: 0;

  font-size: 30px;

  font-weight: 200;

  cursor: pointer;

  display: none;

}

.close-overlay.visible {

  display: block;

}

.section-kicker {

  color: #888;

  letter-spacing: .24em;

  text-transform: uppercase;

  margin-bottom: 16px;

}

.section-title {

  font-size: clamp(40px, 8vw, 82px);

  font-weight: normal;

  letter-spacing: -.045em;

  margin: 0 0 30px;

.section-intro {

  line-height: 1.75;

  max-width: 780px;

  color: #d3d0cb;

  margin: 0 0 65px;

}

.section-heading {

  font-weight: normal;

  margin: 65px 0 25px;

.body-copy {

  color: #bdbab5;

  line-height: 1.95;

  font-size: 15px;

/* CARDS */

.cards {

  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 16px;

}

.card {

  background: var(--panel);

  padding: 30px;

  min-height: 220px;

  display: flex;

  flex-direction: column;

  justify-content: space-between;

  min-width: 0;

}

.card-number {

  color: #777;

  font-size: 11px;

  letter-spacing: .12em;

}

.card-title {

  margin: 25px 0 12px;

  font-family: Georgia, serif;

  font-weight: normal;

  font-size: clamp(23px, 3vw, 32px);

  line-height: 1.18;

  overflow-wrap: anywhere;

}

.card-description {

  color: #aaa7a2;

  line-height: 1.8;

  font-size: 13px;

  margin: 0;

}

/* ABOUT — THREE COLUMNS */

.about-cards {

  grid-template-columns: repeat(3, minmax(0, 1fr));

}

.about-cards .card {

  min-height: 255px;

.filter-label {

  color: #777;

  font-size: 10px;

  letter-spacing: .18em;

  text-transform: uppercase;

  gap: 10px;

  margin-bottom: 35px;

.filter-bar button.active {

  background: #eee;

  color: #111;

.filter-bar button:hover {

}

.primary-filters {

  grid-template-columns: repeat(4, minmax(0, 1fr));

  gap: 9px;

.primary-filters button {

  padding: 10px 7px;

.secondary-filters {

  }

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {

  *,

  *::before,

  *::after {

    animation: none !important;

    scroll-behavior: auto !important;

  }

  .theme-word {

    opacity: 1;

  }

}

function element(tag, className, text) {

  const node = document.createElement(tag);

  if (className) {

    node.className = className;

  }

  if (text !== undefined) {

    node.textContent = text;

  }

  return node;

}

function renderHome() {

  const data = CONTENT[currentLang];

  document.documentElement.lang = currentLang;

  document.getElementById("homeRoles").textContent = data.roles;

  const themes = document.getElementById("homeThemes");

  themes.replaceChildren();

  data.themes.forEach(theme => {

    themes.appendChild(

      element("span", "theme-word", theme)

    );

  });

  nav.replaceChildren();

  ORDER.forEach(key => {

    const button = element(

      "button",

      "",

      data.navigation[key]

    );

    button.type = "button";

    button.addEventListener("click", () => openSection(key));

    nav.appendChild(button);

  });

  document.querySelectorAll("[data-lang]").forEach(button => {

    const active = button.dataset.lang === currentLang;

    button.classList.toggle("active", active);

    button.setAttribute("aria-pressed", String(active));

  });

  document.title = "VARDAPET — " + data.roles;

}

function addHeader(container, kicker, title, intro) {

  container.appendChild(

    element("div", "section-kicker", kicker)

  );

  container.appendChild(

    element("h1", "section-title", title)

  );

  container.appendChild(

    element("p", "section-intro", intro)

  );

}

function addCards(container, items, extraClass = "") {

  const grid = element("div", "cards " + extraClass);

  items.forEach((item, index) => {

    const card = element("article", "card");

    card.appendChild(

      element(

        "div",

        "card-number",

        String(index + 1).padStart(2, "0")

      )

    );

    const bottom = element("div");

    bottom.appendChild(

      element("h2", "card-title", item[0])

    );

    bottom.appendChild(

      element("p", "card-description", item[1])

    );

    card.appendChild(bottom);

    grid.appendChild(card);

  });

  container.appendChild(grid);

}

function renderAbout(container, data) {

  addHeader(

    container,

    data.kicker,

    data.title,

    data.intro

  );

  container.appendChild(

    element("p", "body-copy", data.body)

  );

  container.appendChild(

    element("p", "body-copy", data.philosophy)

  );

  container.appendChild(

    element("h2", "section-heading", data.heading)

  addCards(container, data.cards, "about-cards");

function createFilterGroup(container, label, options, groupName) {

  container.appendChild(

    element("div", "filter-label", label)

  );

  const bar = element(

    "div",

    groupName === "role"

      ? "filter-bar primary-filters"

      : "filter-bar secondary-filters"

  );

  Object.entries(options).forEach(([key, text]) => {

    const button = element("button", "", text);

    button.type = "button";

    button.dataset.filter = key;

    button.dataset.group = groupName;

    button.addEventListener("click", () => {

      if (groupName === "role") {

        currentRoleFilter = key;

      } else {

        currentTypeFilter = key;

      }

      applyPortfolioFilters();

    });

    bar.appendChild(button);

  });

  container.appendChild(bar);

}

function applyPortfolioFilters() {

  let visibleCount = 0;

  document.querySelectorAll(".portfolio-card").forEach(card => {

    const roles = card.dataset.roles.split(",");

    const type = card.dataset.type;

    const matchesRole =

      currentRoleFilter === "all" ||

      roles.includes(currentRoleFilter);

    const matchesType =

      currentTypeFilter === "all" ||

      type === currentTypeFilter;

    const visible = matchesRole && matchesType;

    card.hidden = !visible;

    if (visible) {

      visibleCount++;

    }

  });

  document.querySelectorAll(".filter-bar button").forEach(button => {

    const active = button.dataset.group === "role"

      ? button.dataset.filter === currentRoleFilter

      : button.dataset.filter === currentTypeFilter;

    button.classList.toggle("active", active);

    button.setAttribute("aria-pressed", String(active));

  });

  const counter = document.getElementById("portfolioResults");

  if (counter) {

    counter.textContent =

      CONTENT[currentLang].portfolio.results + ": " + visibleCount;

  }

}

  );

  const counter = element("div", "results-count");

  container.appendChild(counter);

  const grid = element("div", "cards");

    const card = element("article", "card portfolio-card");

    card.dataset.type = item.type;

    grid.appendChild(card);

function renderSection(key) {

  const data = CONTENT[currentLang][key];

  const container = document.createElement("div");

  if (key === "about") {

    renderAbout(container, data);

  } else if (key === "portfolio") {

    renderPortfolio(container, data);

  } else if (key === "contact") {

    renderContact(container, data);

  } else {

    addHeader(

      container,

      data.kicker,

      data.title,

      data.intro

    );

    addCards(container, data.cards);

  }

  overlayContent.replaceChildren(...container.childNodes);

  overlay.scrollTop = 0;

  overlay.setAttribute(

    "aria-label",

    CONTENT[currentLang].navigation[key]

  );

  if (key === "portfolio") {

    applyPortfolioFilters();

  }

}

function openSection(key) {

  if (!ORDER.includes(key)) {

    return;

  }

  previousFocus = document.activeElement;

  currentSection = key;

  renderSection(key);

  overlay.classList.add("open");

  closeButton.classList.add("visible");

  document.body.style.overflow = "hidden";

  closeButton.focus();

}

function closeSection() {

  overlay.classList.remove("open");

  closeButton.classList.remove("visible");

  document.body.style.overflow = "";

  currentSection = null;

  if (previousFocus && previousFocus.isConnected) {

    previousFocus.focus();

  }

}

function changeLanguage(lang) {

  if (!CONTENT[lang]) {

    return;

  }

  currentLang = lang;

  renderHome();

  if (currentSection) {

    renderSection(currentSection);

  }

}

document.querySelectorAll("[data-lang]").forEach(button => {

  button.addEventListener("click", () => {

    changeLanguage(button.dataset.lang);

  });

});

closeButton.addEventListener("click", closeSection);

document.addEventListener("keydown", event => {

  if (event.key === "Escape" && currentSection) {

    closeSection();

  }

  if (event.key === "Tab" && currentSection) {

    const focusable = [

      closeButton,

      ...overlay.querySelectorAll(

        'button:not([disabled]), a[href], input, select, textarea'

      )

    ].filter(node => node.getClientRects().length > 0);

    const first = focusable[0];

    const last = focusable[focusable.length - 1];

    if (event.shiftKey && document.activeElement === first) {

      event.preventDefault();

      last.focus();

    } else if (

      !event.shiftKey &&

      document.activeElement === last

    ) {

      event.preventDefault();

      first.focus();

    }

  }

});

renderHome();
