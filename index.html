
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="robots" content="index,follow">
<meta name="description" content="VARDAPET — Vardui Petrosyan. Director, Digital Creator and Cultural Researcher.">
<link rel="canonical" href="https://vardapet.de/">
<title>VARDAPET — Vardui Petrosyan</title>

<style>
:root{
  --bg:#080808;
  --fg:#f1efec;
  --muted:#b6b1ac;
  --line:#373431;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--fg);
  font-family:Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{
  outline:1px solid white;
  outline-offset:4px;
}
.site{
  position:relative;
  width:100%;
  height:100svh;
  min-height:320px;
  overflow:hidden;
}
.scene{
  position:absolute;
  inset:0;
  overflow:hidden;
  transition:opacity .85s ease,visibility .85s ease;
}
.scene[aria-hidden="true"]{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

/* INTRO */
.intro{
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#05070d;
  isolation:isolate;
}
.intro-photo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  z-index:-3;
}
.intro::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.22);
  z-index:-2;
}
.intro::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(
    ellipse at center,
    rgba(0,0,0,.03) 12%,
    rgba(0,0,0,.34) 100%
  );
  z-index:-1;
}

/* DEEP AMETHYST GLOW */
.logo-entry{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  width:min(95vw,900px);
  border:0;
  background:transparent;
  transform-origin:center;
  animation:logoBreath 4.8s ease-in-out infinite;
  isolation:isolate;
}
.logo-entry::before{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  top:17%;
  bottom:17%;
  z-index:-1;
  pointer-events:none;
  background:radial-gradient(
    ellipse at center,
    rgba(92,55,145,.32) 0%,
    rgba(69,37,111,.2) 38%,
    rgba(33,18,58,.06) 65%,
    transparent 80%
  );
  filter:blur(34px);
  animation:amethystHalo 4.8s ease-in-out infinite;
}
.logo-entry img{
  display:block;
  width:100%;
  max-height:65svh;
  object-fit:contain;
  animation:amethystLight 4.8s ease-in-out infinite;
}
@keyframes logoBreath{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.038)}
}
@keyframes amethystLight{
  0%,100%{
    filter:
      brightness(2.05)
      contrast(1.15)
      drop-shadow(0 0 3px rgba(242,237,255,.85))
      drop-shadow(0 0 10px rgba(136,98,190,.52))
      drop-shadow(0 0 25px rgba(79,42,137,.33));
  }
  50%{
    filter:
      brightness(2.42)
      contrast(1.18)
      drop-shadow(0 0 5px rgba(250,246,255,.95))
      drop-shadow(0 0 15px rgba(153,109,213,.65))
      drop-shadow(0 0 34px rgba(91,49,157,.43));
  }
}
@keyframes amethystHalo{
  0%,100%{opacity:.55;transform:scale(.96)}
  50%{opacity:.9;transform:scale(1.07)}
}
.intro.entering .logo-entry{
  animation:enterLogo .8s ease-in forwards;
}
.intro.entering .logo-entry img,
.intro.entering .logo-entry::before{
  animation:none;
}
@keyframes enterLogo{
  from{transform:scale(1);opacity:1}
  to{transform:scale(1.14);opacity:0}
}

/* MAIN VISUAL */
.visual{
  z-index:1;
  background:#15110d;
  isolation:isolate;
}
.visual-photo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  z-index:-3;
}
.visual::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.48) 0%,
    rgba(0,0,0,.12) 30%,
    transparent 48%,
    rgba(0,0,0,.18) 68%,
    rgba(0,0,0,.72) 100%
  );
}
.visual::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:radial-gradient(
    ellipse at center,
    transparent 35%,
    rgba(0,0,0,.17) 100%
  );
}
.return-logo{
  position:absolute;
  z-index:6;
  top:calc(22px + env(safe-area-inset-top));
  left:25px;
  border:0;
  background:transparent;
  color:white;
  font:italic 19px Georgia,"Times New Roman",serif;
  letter-spacing:.08em;
  text-shadow:0 2px 12px rgba(0,0,0,.7);
}
.language-switch{
  position:absolute;
  z-index:6;
  top:calc(25px + env(safe-area-inset-top));
  right:25px;
  display:flex;
  gap:17px;
}
.language-switch button{
  padding:5px 0 9px;
  border:0;
  border-bottom:1px solid transparent;
  background:transparent;
  color:rgba(255,255,255,.7);
  font-size:11px;
  letter-spacing:.15em;
}
.language-switch button.active{
  color:white;
  border-bottom-color:white;
}
.visual-heading{
  position:absolute;
  top:calc(13% + env(safe-area-inset-top));
  left:5%;
  width:90%;
  margin:0;
  text-align:center;
  color:white;
  font-family:Georgia,"Times New Roman",serif;
  font-style:italic;
  font-weight:normal;
  font-size:clamp(19px,3.2vw,42px);
  line-height:1.5;
  letter-spacing:-.02em;
  text-shadow:0 2px 20px rgba(0,0,0,.6);
}
.visual-navigation{
  position:absolute;
  bottom:calc(8% + env(safe-area-inset-bottom));
  left:4%;
  width:92%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:clamp(15px,3vw,42px);
}
.visual-navigation button{
  padding:9px 0;
  border:0;
  border-bottom:1px solid transparent;
  background:transparent;
  color:white;
  font-size:clamp(10px,1.2vw,13px);
  letter-spacing:.16em;
  text-transform:uppercase;
  text-shadow:0 2px 10px rgba(0,0,0,.8);
}
.visual-navigation button:hover{
  border-bottom-color:white;
}
.visual-footer{
  position:absolute;
  bottom:calc(12px + env(safe-area-inset-bottom));
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:16px;
}
.visual-footer button{
  border:0;
  background:transparent;
  color:rgba(255,255,255,.75);
  font-size:10px;
  letter-spacing:.1em;
  padding:5px 9px;
}

/* OVERLAYS */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  overflow-y:auto;
  overscroll-behavior:contain;
  background:#080808;
  padding:
    calc(105px + env(safe-area-inset-top))
    24px
    calc(70px + env(safe-area-inset-bottom));
}
.overlay.open{display:block}
.overlay-inner{
  max-width:1050px;
  margin:0 auto;
  animation:appear .3s ease both;
}
@keyframes appear{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.close-overlay{
  display:none;
  position:fixed;
  z-index:110;
  top:calc(25px + env(safe-area-inset-top));
  right:26px;
  border:0;
  background:transparent;
  color:white;
  font-size:34px;
  line-height:1;
}
.close-overlay.visible{display:block}
.section-kicker{
  color:#999;
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  margin-bottom:17px;
}
.section-title{
  margin:0 0 28px;
  font:normal clamp(43px,8vw,83px)/1.08 Georgia,serif;
  letter-spacing:-.04em;
}
.section-intro{
  max-width:790px;
  margin:0 0 50px;
  color:#d1cdc8;
  font-size:clamp(16px,2vw,20px);
  line-height:1.8;
}
.body-copy{
  max-width:790px;
  color:#bdb9b4;
  font-size:15px;
  line-height:1.9;
}
.section-heading{
  margin:55px 0 25px;
  font:normal clamp(28px,4vw,43px) Georgia,serif;
}
.cards{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}
.card{
  min-width:0;
  min-height:220px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:28px;
  border:1px solid var(--line);
  background:#111110;
}
.card-number{
  color:#777;
  font-size:10px;
  letter-spacing:.12em;
}
.card-title{
  margin:25px 0 12px;
  font:normal clamp(23px,3vw,31px)/1.2 Georgia,serif;
  overflow-wrap:anywhere;
}
.card-description{
  margin:0;
  color:#aaa6a0;
  font-size:13px;
  line-height:1.75;
}
.about-cards{
  grid-template-columns:repeat(3,minmax(0,1fr));
}
.about-cards .card{
  justify-content:flex-end;
}
.about-cards .card-title{
  margin-top:0;
}

/* PORTFOLIO — ONE FILTER */
.filter-label{
  margin:30px 0 14px;
  color:#888;
  font-size:10px;
  letter-spacing:.17em;
  text-transform:uppercase;
}
.filter-bar{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:9px;
  margin-bottom:30px;
}
.filter-bar button{
  min-height:55px;
  padding:11px 13px;
  border:1px solid #494643;
  background:transparent;
  color:#bbb;
  font-size:11px;
}
.filter-bar button.active{
  color:#080808;
  background:#eee;
  border-color:#eee;
}
.portfolio-card[hidden]{display:none}
.results-count{
  margin:0 0 20px;
  color:#999;
  font-size:12px;
}
.project-status{
  display:block;
  margin-top:17px;
  color:#aaa;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.1em;
}

/* COMPACT CONTACT LINKS */
.contact-links{
  display:flex;
  flex-direction:column;
  max-width:650px;
  margin-top:32px;
  gap:8px;
}
.contact-link{
  display:flex;
  align-items:center;
  gap:15px;
  min-height:57px;
  padding:13px 16px;
  border:1px solid #34312f;
  background:#111110;
  color:#eee;
  text-decoration:none;
  font-size:14px;
  line-height:1.5;
  transition:background .2s,border-color .2s;
}
.contact-link:hover{
  background:#1c191d;
  border-color:#756083;
}
.contact-icon{
  flex:0 0 23px;
  width:23px;
  height:23px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.contact-icon svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.contact-text{
  flex:1;
  overflow-wrap:anywhere;
}
.contact-arrow{
  color:#777;
  font-size:16px;
}
.legal-links{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  margin-top:65px;
}
.legal-links button{
  border:0;
  background:transparent;
  color:#aaa;
  padding:5px 0;
  font-size:12px;
}
.privacy-block{
  border-top:1px solid var(--line);
  padding:24px 0;
  max-width:850px;
}
.privacy-block h2{
  margin:0 0 15px;
  font:normal clamp(21px,3vw,28px) Georgia,serif;
}
.privacy-block p{
  color:#bdb9b4;
  font-size:14px;
  line-height:1.9;
  overflow-wrap:anywhere;
}
.privacy-block a{
  color:#eee;
  text-underline-offset:4px;
}
.privacy-note{
  color:#999;
  font-size:12px;
  margin-bottom:35px;
}
.legal-pending{
  border:1px solid #49413c;
  padding:17px 19px;
  margin:20px 0 38px;
  color:#c7bbb4;
  font-size:13px;
  line-height:1.7;
}

@media(max-width:650px){
  .logo-entry{width:96vw}
  .return-logo{
    left:15px;
    font-size:15px;
  }
  .language-switch{
    right:15px;
    gap:12px;
  }
  .visual-heading{
    top:calc(16% + env(safe-area-inset-top));
    left:6%;
    width:88%;
    font-size:clamp(20px,5vw,28px);
    line-height:1.6;
  }
  .visual-navigation{
    bottom:calc(9% + env(safe-area-inset-bottom));
    left:3%;
    width:94%;
    gap:8px 18px;
  }
  .visual-navigation button{
    font-size:clamp(9px,2.4vw,11px);
    letter-spacing:.11em;
  }
  .cards{grid-template-columns:1fr}
  .about-cards{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:7px;
  }
  .about-cards .card{
    padding:12px 8px;
    min-height:170px;
  }
  .about-cards .card-title{
    font-size:clamp(12px,3.2vw,17px);
  }
  .about-cards .card-description{
    font-size:10px;
    line-height:1.5;
  }
  .filter-bar{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .overlay{
    padding:
      calc(105px + env(safe-area-inset-top))
      20px
      calc(65px + env(safe-area-inset-bottom));
  }
  .contact-link{font-size:13px}
}
@media(prefers-reduced-motion:reduce){
  .logo-entry,
  .logo-entry img,
  .logo-entry::before,
  .intro.entering .logo-entry{
    animation:none;
  }
  .scene{transition:none}
  .overlay-inner{animation:none}
}
</style>
</head>

const ORDER=[
  "about",
  "portfolio",
  "research",
  "collaborations",
  "contact"
];

let lang="en";
let section=null;
let roleFilter="all";
let previousFocus=null;
let activeScreen="intro";
let transitioning=false;

const intro=document.getElementById("intro");
const visual=document.getElementById("visual");
const enterSite=document.getElementById("enterSite");
const returnIntro=document.getElementById("returnIntro");
const overlay=document.getElementById("overlay");
const content=document.getElementById("overlayContent");
const closeBtn=document.getElementById("closeOverlay");
const home=document.getElementById("home");

function el(tag,cls="",value){
  const node=document.createElement(tag);
  if(cls)node.className=cls;
  if(value!==undefined)node.textContent=value;
  return node;
}

function showScreen(next){
  if(transitioning||activeScreen===next)return;
  transitioning=true;

  if(next==="visual"){
    intro.classList.add("entering");

    setTimeout(()=>{
      visual.setAttribute("aria-hidden","false");
      intro.setAttribute("aria-hidden","true");
      intro.classList.remove("entering");
      intro.inert=true;
      visual.inert=false;
      activeScreen="visual";
      transitioning=false;
      returnIntro.focus({preventScroll:true});
    },650);
  }else{
    intro.setAttribute("aria-hidden","false");
    visual.setAttribute("aria-hidden","true");
    intro.inert=false;
    visual.inert=true;
    activeScreen="intro";

    setTimeout(()=>{
      transitioning=false;
      enterSite.focus({preventScroll:true});
    },850);
  }
}

function header(parent,data){
  if(data.kicker){
    parent.append(
      el("div","section-kicker",data.kicker)
    );
  }

  parent.append(
    el("h1","section-title",data.title),
    el("p","section-intro",data.intro)
  );
}

function cards(parent,items,extra="",numbered=true){
  const grid=el("div","cards "+extra);

  items.forEach((item,i)=>{
    const card=el("article","card");

    if(numbered){
      card.append(
        el("div","card-number",String(i+1).padStart(2,"0"))
      );
    }

    const bottom=el("div");

    bottom.append(
      el("h2","card-title",item[0]),
      el("p","card-description",item[1])
    );

    card.append(bottom);
    grid.append(card);
  });

  parent.append(grid);
}

function renderHome(){
  document.documentElement.lang=lang;
  document.getElementById("roles").textContent=
    CONTENT[lang].roles;

  const nav=document.getElementById("navigation");
  nav.replaceChildren();

  ORDER.forEach(key=>{
    const b=el("button","",CONTENT[lang].nav[key]);
    b.type="button";
    b.addEventListener("click",()=>openSection(key));
    nav.append(b);
  });

  document.getElementById("privacyFooter").textContent=
    CONTENT[lang].privacyLabel;

  document.querySelectorAll("[data-lang]").forEach(b=>{
    const active=b.dataset.lang===lang;
    b.classList.toggle("active",active);
    b.setAttribute("aria-pressed",String(active));
  });

  document.title="VARDAPET — "+CONTENT[lang].roles;

  const descriptions={
    en:"VARDAPET — the independent artistic practice of Vardui Petrosyan. Direction, digital creation and cultural research.",
    de:"VARDAPET — die unabhängige künstlerische Praxis von Vardui Petrosyan. Regie, digitale Gestaltung und Kulturforschung.",
    ru:"VARDAPET — независимая художественная практика Вардуи Петросян. Режиссура, цифровое творчество и культурные исследования."
  };

  document.querySelector('meta[name="description"]').content=
    descriptions[lang];
}

function renderAbout(parent,data){
  header(parent,data);

  parent.append(
    el("p","body-copy",data.body),
    el("p","body-copy",data.philosophy),
    el("h2","section-heading",data.heading)
  );

  cards(parent,data.cards,"about-cards",false);
}

function applyFilters(){
  let count=0;

  overlay.querySelectorAll(".portfolio-card").forEach(card=>{
    const matches=
      roleFilter==="all"||
      card.dataset.roles.split(",").includes(roleFilter);

    card.hidden=!matches;
    if(matches)count++;
  });

  overlay.querySelectorAll(".filter-bar button").forEach(b=>{
    const active=b.dataset.filter===roleFilter;
    b.classList.toggle("active",active);
    b.setAttribute("aria-pressed",String(active));
  });

  const counter=document.getElementById("resultsCount");

  if(counter){
    counter.textContent=
      CONTENT[lang].portfolio.results+": "+count;
  }
}

function renderPortfolio(parent,data){
  header(parent,data);

  parent.append(
    el("div","filter-label",data.roleLabel)
  );

  const bar=el("div","filter-bar");

  Object.entries(data.roleFilters).forEach(([key,value])=>{
    const b=el("button","",value);
    b.type="button";
    b.dataset.filter=key;

    b.addEventListener("click",()=>{
      roleFilter=key;
      applyFilters();
    });

    bar.append(b);
  });

  parent.append(bar);

  const counter=el("div","results-count");
  counter.id="resultsCount";
  parent.append(counter);

  const grid=el("div","cards");

  data.items.forEach((item,i)=>{
    const card=el("article","card portfolio-card");
    card.dataset.roles=item[2].join(",");

    card.append(
      el("div","card-number",String(i+1).padStart(2,"0"))
    );

    const bottom=el("div");

    bottom.append(
      el("h2","card-title",item[0]),
      el("p","card-description",item[1])
    );

    if(item[3]){
      bottom.append(
        el("span","project-status",item[3])
      );
    }

    card.append(bottom);
    grid.append(card);
  });

  parent.append(grid);
}

function iconSvg(kind){
  const ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 24 24");
  svg.setAttribute("aria-hidden","true");

  function shape(tag,attrs){
    const node=document.createElementNS(ns,tag);
    Object.entries(attrs).forEach(([k,v])=>{
      node.setAttribute(k,v);
    });
    svg.append(node);
  }

  if(kind==="instagram"){
    shape("rect",{x:2.5,y:2.5,width:19,height:19,rx:5});
    shape("circle",{cx:12,cy:12,r:4.2});
    shape("circle",{cx:17.6,cy:6.5,r:.9,fill:"currentColor",stroke:"none"});
  }else if(kind==="mail"){
    shape("rect",{x:2,y:4.5,width:20,height:15,rx:2});
    shape("path",{d:"M3 6l9 7 9-7"});
  }else{
    shape("path",{
      d:"M7 3.5l3.1 3.1-1.9 2.7c1.3 2.6 3.5 4.8 6.1 6.1l2.7-1.9 3.1 3.1-2.1 3.5c-.4.7-1.2 1-2 .8C9.3 19.4 4.6 14.7 3.1 8c-.2-.8.1-1.6.8-2L7 3.5z"
    });
  }

  return svg;
}

function renderContact(parent,data){
  header(parent,data);
  parent.append(el("p","body-copy",data.location));

  const links=el("div","contact-links");

  const entries=[
    ["instagram","Instagram · @vardapet_",CONTACT.instagram],
    ["mail",CONTACT.email,"mailto:"+CONTACT.email],
    ["phone",CONTACT.phone,"tel:"+CONTACT.tel]
  ];

  entries.forEach(([kind,label,href])=>{
    const a=el("a","contact-link");
    a.href=href;

    if(href.startsWith("https://")){
      a.target="_blank";
      a.rel="noopener noreferrer";
    }

    const icon=el("span","contact-icon");
    icon.append(iconSvg(kind));

    a.append(
      icon,
      el("span","contact-text",label),
      el("span","contact-arrow","↗")
    );

    links.append(a);
  });

  parent.append(links);

  const legal=el("div","legal-links");

  [
    [CONTENT[lang].privacyLabel,"privacy"],
    ["Impressum","imprint"]
  ].forEach(([label,key])=>{
    const b=el("button","",label);
    b.type="button";
    b.addEventListener("click",()=>openSection(key));
    legal.append(b);
  });

  parent.append(legal);
}

function linkify(parent,text){
  const p=el("p");
  const re=/(https?:\/\/[^\s]+|petrosyanvardui@gmail\.com)/g;

  text.split(re).forEach(part=>{
    if(!part)return;

    if(
      part.startsWith("https://")||
      part==="petrosyanvardui@gmail.com"
    ){
      const a=el("a","",part);
      a.href=part.startsWith("https://")
        ?part
        :"mailto:"+part;

      if(part.startsWith("https://")){
        a.target="_blank";
        a.rel="noopener noreferrer";
      }

      p.append(a);
    }else{
      p.append(document.createTextNode(part));
    }
  });

  parent.append(p);
}

function renderLegal(parent,data,withNotice=false){
  header(parent,data);

  if(data.updated){
    parent.append(
      el("div","privacy-note",data.updated)
    );
  }

  if(withNotice&&data.notice){
    parent.append(
      el("div","legal-pending",data.notice)
    );
  }

  data.sections.forEach(([title,paragraphs])=>{
    const block=el("section","privacy-block");
    block.append(el("h2","",title));

    paragraphs.forEach(p=>linkify(block,p));
    parent.append(block);
  });
}

function renderSection(key){
  const wrapper=el("div");

  if(key==="privacy"){
    renderLegal(wrapper,PRIVACY[lang]);
  }else if(key==="imprint"){
    renderLegal(wrapper,IMPRINT[lang],true);
  }else{
    const data=CONTENT[lang][key];

    if(key==="about"){
      renderAbout(wrapper,data);
    }else if(key==="portfolio"){
      renderPortfolio(wrapper,data);
    }else if(key==="contact"){
      renderContact(wrapper,data);
    }else{
      header(wrapper,data);
      cards(wrapper,data.cards);
    }
  }

  content.replaceChildren(wrapper);
  overlay.scrollTop=0;

  overlay.setAttribute(
    "aria-label",
    key==="privacy"
      ?CONTENT[lang].privacyLabel
      :key==="imprint"
        ?"Impressum"
        :CONTENT[lang].nav[key]
  );

  if(key==="portfolio")applyFilters();
}

function openSection(key){
  if(![...ORDER,"privacy","imprint"].includes(key))return;

  if(!section){
    previousFocus=document.activeElement;
  }

  section=key;
  renderSection(key);

  overlay.classList.add("open");
  closeBtn.classList.add("visible");
  document.body.style.overflow="hidden";
  home.inert=true;
  closeBtn.focus();
}

function closeSection(){
  overlay.classList.remove("open");
  closeBtn.classList.remove("visible");

  document.body.style.overflow="";
  home.inert=false;

  intro.inert=activeScreen!=="intro";
  visual.inert=activeScreen!=="visual";

  section=null;

  if(previousFocus&&previousFocus.isConnected){
    previousFocus.focus();
  }

  previousFocus=null;
}

function changeLanguage(next){
  if(!CONTENT[next])return;

  lang=next;
  renderHome();

  if(section)renderSection(section);
}

enterSite.addEventListener(
  "click",
  ()=>showScreen("visual")
);

returnIntro.addEventListener(
  "click",
  ()=>showScreen("intro")
);

document.querySelectorAll("[data-lang]").forEach(b=>{
  b.addEventListener(
    "click",
    ()=>changeLanguage(b.dataset.lang)
  );
});

document.getElementById("privacyFooter").addEventListener(
  "click",
  ()=>openSection("privacy")
);

document.getElementById("imprintFooter").addEventListener(
  "click",
  ()=>openSection("imprint")
);

closeBtn.addEventListener("click",closeSection);

document.addEventListener("keydown",event=>{
  if(!section)return;

  if(event.key==="Escape"){
    closeSection();
    return;
  }

  if(event.key!=="Tab")return;

  const focusable=[
    closeBtn,
    ...overlay.querySelectorAll(
      'button:not([disabled]),a[href],input,select,textarea'
    )
  ].filter(node=>node.getClientRects().length>0);

  if(!focusable.length)return;

  const first=focusable[0];
  const last=focusable[focusable.length-1];

  if(event.shiftKey&&document.activeElement===first){
    event.preventDefault();
    last.focus();
  }else if(
    !event.shiftKey&&document.activeElement===last
  ){
    event.preventDefault();
    first.focus();
  }
});

intro.inert=false;
visual.inert=true;
renderHome();
</script>
