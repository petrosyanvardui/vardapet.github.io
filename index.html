<<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">

<meta
  name="description"
  content="VARDAPET — the independent artistic practice of Vardui Petrosyan. Direction, digital creation and cultural research."
>

<meta name="robots" content="index, follow">
<link rel="canonical" href="https://vardapet.de/">

<title>VARDAPET — Director · Digital Creator · Cultural Researcher</title>

<style>
:root {
  --bg: #080808;
  --fg: #f2f0ec;
  --muted: #aaa7a2;
  --line: #343331;
  --panel: #111110;
}

* {
  box-sizing: border-box;
}

html {
  margin: 0;
  padding: 0;
  background: var(--bg);
  scroll-behavior: smooth;
  scroll-snap-type: y proximity;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  font: inherit;
}

a {
  color: inherit;
}

button:focus-visible,
a:focus-visible {
  outline: 1px solid #fff;
  outline-offset: 5px;
}

/* =========================================================
   LANGUAGE SWITCH
========================================================= */

.language-switch {
  position: fixed;
  z-index: 200;
  top: calc(22px + env(safe-area-inset-top));
  right: 24px;
  display: flex;
  align-items: center;
  gap: 15px;
}

.language-switch button {
  border: 0;
  border-bottom: 1px solid transparent;
  background: none;
  color: rgba(255,255,255,.38);
  font-size: 11px;
  letter-spacing: .14em;
  padding: 7px 0;
  cursor: pointer;
  transition:
    color .25s ease,
    border-color .25s ease;
}

.language-switch button.active {
  color: #fff;
  border-bottom-color: #fff;
}

/* =========================================================
   THREE HOME SCENES
========================================================= */

.home {
  width: 100%;
  background: var(--bg);
}

.scene {
  position: relative;
  width: 100%;
  min-height: 100svh;
  overflow: hidden;
  scroll-snap-align: start;
  scroll-snap-stop: normal;
}

/* =========================================================
   SCENE 01 — VARDAPET
========================================================= */

.scene-intro {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding:
    calc(80px + env(safe-area-inset-top))
    24px
    calc(70px + env(safe-area-inset-bottom));

  text-align: center;
  background: #080808;
}

.brand {
  width: min(82vw, 570px);
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

.roles {
  margin-top: clamp(30px, 5vh, 60px);
  color: #d5d3d0;
  font-size: clamp(9px, 1.4vw, 12px);
  letter-spacing: .20em;
  line-height: 2;
  text-transform: uppercase;
}

.scroll-cue {
  position: absolute;
  left: 50%;
  bottom: calc(27px + env(safe-area-inset-bottom));
  transform: translateX(-50%);

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 11px;

  color: rgba(255,255,255,.38);
  font-size: 8px;
  letter-spacing: .28em;
  text-transform: uppercase;
  pointer-events: none;
}

.scroll-line {
  display: block;
  width: 1px;
  height: 36px;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,.55),
    rgba(255,255,255,0)
  );
  animation: scrollPulse 2.2s ease-in-out infinite;
}

@keyframes scrollPulse {
  0%, 100% {
    opacity: .25;
    transform: scaleY(.65);
    transform-origin: top;
  }

  50% {
    opacity: 1;
    transform: scaleY(1);
    transform-origin: top;
  }
}

/* =========================================================
   SCENE 02 — IMAGE / THEMES
========================================================= */

.scene-manifesto {
  min-height: 100svh;
  background: #050505;
  isolation: isolate;
}

.manifesto-image {
  position: absolute;
  z-index: -3;
  inset: -4%;
  width: 108%;
  height: 108%;
  object-fit: cover;
  object-position: center center;
  transform: scale(1.01);
}

.manifesto-shade {
  position: absolute;
  z-index: -2;
  inset: 0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.34) 0%,
      rgba(0,0,0,.06) 24%,
      rgba(0,0,0,.05) 55%,
      rgba(0,0,0,.34) 100%
    );
}

.manifesto-vignette {
  position: absolute;
  z-index: -1;
  inset: 0;

  background:
    radial-gradient(
      ellipse at center,
      rgba(0,0,0,0) 35%,
      rgba(0,0,0,.18) 75%,
      rgba(0,0,0,.38) 100%
    );
}

.themes {
  position: absolute;
  inset: 0;
  z-index: 2;
}

.theme-word {
  position: absolute;
  width: max-content;
  max-width: 48%;

  color: rgba(255,255,255,.92);

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: clamp(24px, 3.8vw, 46px);
  font-weight: normal;
  font-style: italic;
  line-height: 1.15;

  text-shadow:
    0 1px 14px rgba(0,0,0,.48),
    0 2px 30px rgba(0,0,0,.25);

  opacity: 0;

  animation:
    manifestoFade 11s ease-in-out infinite;

  pointer-events: none;
}

/*
  All five begin quickly.
  Slightly different delays create movement,
  but there is no long wait between words.
*/

.theme-word:nth-child(1) {
  top: 13%;
  left: 8%;
  animation-delay: 0s;
}

.theme-word:nth-child(2) {
  top: 24%;
  right: 7%;
  animation-delay: .45s;
}

.theme-word:nth-child(3) {
  top: 46%;
  left: 7%;
  animation-delay: .9s;
}

.theme-word:nth-child(4) {
  top: 67%;
  right: 9%;
  animation-delay: 1.35s;
}

.theme-word:nth-child(5) {
  left: 8%;
  bottom: 10%;
  max-width: 70%;
  animation-delay: 1.8s;
  font-size: clamp(22px, 3.4vw, 40px);
}

@keyframes manifestoFade {
  0% {
    opacity: 0;
    transform: translateY(6px);
  }

  12% {
    opacity: 1;
    transform: translateY(0);
  }

  65% {
    opacity: 1;
    transform: translateY(0);
  }

  84% {
    opacity: 0;
    transform: translateY(-3px);
  }

  100% {
    opacity: 0;
    transform: translateY(-3px);
  }
}

/* =========================================================
   SCENE 03 — NAVIGATION
========================================================= */

.scene-navigation {
  min-height: 100svh;

  display: flex;
  flex-direction: column;
  justify-content: center;

  padding:
    calc(95px + env(safe-area-inset-top))
    clamp(26px, 8vw, 120px)
    calc(60px + env(safe-area-inset-bottom));

  background: #080808;
}

.navigation-intro {
  margin-bottom: clamp(35px, 6vh, 70px);
  color: #6e6b67;
  font-size: 9px;
  letter-spacing: .25em;
  text-transform: uppercase;
}

.main-nav {
  width: 100%;
  max-width: 1050px;
  display: flex;
  flex-direction: column;
}

.main-nav button {
  position: relative;
  width: 100%;

  border: 0;
  border-bottom: 1px solid #242321;

  background: transparent;
  color: #e9e6e1;

  padding: clamp(15px, 2.6vh, 28px) 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: clamp(32px, 6.2vw, 74px);
  font-weight: normal;
  line-height: 1;
  letter-spacing: -.035em;
  text-align: left;

  cursor: pointer;

  transition:
    color .25s ease,
    padding-left .3s ease;
}

.main-nav button:first-child {
  border-top: 1px solid #242321;
}

.main-nav button::after {
  content: "↗";

  position: absolute;
  right: 2px;
  top: 50%;
  transform: translateY(-50%);

  color: #55524f;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: clamp(14px, 2vw, 22px);
  font-weight: 300;

  opacity: .7;
}

.main-nav button:hover {
  color: #fff;
  padding-left: 12px;
}

.home-footer {
  margin-top: clamp(38px, 7vh, 75px);

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 25px;

  color: #5e5b58;
  font-size: 9px;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.footer-links {
  display: flex;
  align-items: center;
  gap: 22px;
}

.footer-links button {
  border: 0;
  background: transparent;
  color: #77736f;
  padding: 5px 0;

  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;

  cursor: pointer;
}

.footer-links button:hover {
  color: #fff;
}

/* =========================================================
   OVERLAY
========================================================= */

.overlay {
  position: fixed;
  z-index: 100;
  inset: 0;

  display: none;
  overflow-y: auto;
  overscroll-behavior: contain;

  background: var(--bg);

  padding:
    calc(115px + env(safe-area-inset-top))
    24px
    calc(85px + env(safe-area-inset-bottom));
}

.overlay.open {
  display: block;
}

.overlay-content {
  max-width: 1050px;
  margin: 0 auto;
  animation: overlayAppear .35s ease both;
}

@keyframes overlayAppear {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.close-overlay {
  position: fixed;
  z-index: 201;

  top: calc(63px + env(safe-area-inset-top));
  right: 25px;

  display: none;

  border: 0;
  background: transparent;
  color: #ddd;

  font-size: 31px;
  font-weight: 200;
  line-height: 1;

  cursor: pointer;
}

.close-overlay.visible {
  display: block;
}

/* =========================================================
   TYPOGRAPHY
========================================================= */

.section-kicker {
  margin-bottom: 16px;

  color: #888;

  font-size: 10px;
  letter-spacing: .24em;
  text-transform: uppercase;
}

.section-title {
  margin: 0 0 30px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: clamp(40px, 8vw, 82px);
  font-weight: normal;
  letter-spacing: -.045em;
}

.section-intro {
  max-width: 780px;
  margin: 0 0 65px;

  color: #d3d0cb;

  font-size: clamp(16px, 2.5vw, 21px);
  line-height: 1.75;
}

.section-heading {
  margin: 65px 0 25px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: clamp(27px, 4vw, 43px);
  font-weight: normal;
}

.body-copy {
  max-width: 780px;

  color: #bdbab5;

  font-size: 15px;
  line-height: 1.95;
}

/* =========================================================
   CARDS
========================================================= */

.cards {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 16px;
}

.card {
  min-width: 0;
  min-height: 220px;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  padding: 30px;

  border: 1px solid var(--line);
  background: var(--panel);
}

.card-number {
  color: #777;

  font-size: 11px;
  letter-spacing: .12em;
}

.card-title {
  margin: 25px 0 12px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: clamp(23px, 3vw, 32px);
  font-weight: normal;
  line-height: 1.18;

  overflow-wrap: anywhere;
}

.card-description {
  margin: 0;

  color: #aaa7a2;

  font-size: 13px;
  line-height: 1.8;
}

/* =========================================================
   ABOUT — THREE COLUMNS
========================================================= */

.about-cards {
  grid-template-columns:
    repeat(3, minmax(0, 1fr));
}

.about-cards .card {
  min-height: 255px;
}

/* =========================================================
   PORTFOLIO FILTERS
========================================================= */

.filter-label {
  margin: 0 0 15px;

  color: #777;

  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
}

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;

  margin-bottom: 35px;
}

.filter-bar button {
  border: 1px solid #444;
  background: transparent;
  color: #aaa;

  padding: 11px 15px;

  font-size: 11px;

  cursor: pointer;

  transition: .2s;
}

.filter-bar button.active {
  border-color: #eee;
  background: #eee;
  color: #111;
}

.filter-bar button:hover {
  border-color: #aaa;
}

.primary-filters {
  display: grid;
  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 9px;
}

.primary-filters button {
  min-height: 58px;
  padding: 10px 7px;
  line-height: 1.5;
}

.secondary-filters {
  margin-bottom: 45px;
}

.portfolio-card {
  min-height: 245px;
}

.portfolio-card[hidden] {
  display: none;
}

.project-status {
  display: inline-block;

  margin-top: 18px;

  color: #898681;

  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
}

.results-count {
  margin: -15px 0 22px;

  color: #777;

  font-size: 11px;
  letter-spacing: .07em;
}

/* =========================================================
   CONTACT
========================================================= */

.contact-links {
  max-width: 760px;

  display: flex;
  flex-direction: column;
}

.contact-links a {
  padding: 25px 0;

  border-bottom: 1px solid var(--line);

  text-decoration: none;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: clamp(20px, 4vw, 34px);

  overflow-wrap: anywhere;
}

.contact-links a:hover {
  color: #aaa;
}

.legal {
  margin-top: 90px;
  padding-top: 25px;

  display: flex;
  flex-wrap: wrap;
  gap: 22px;

  border-top: 1px solid var(--line);

  color: #999;

  font-size: 11px;
}

.legal button {
  border: 0;
  background: transparent;
  color: inherit;
  padding: 0;

  font-size: inherit;

  cursor: pointer;
}

.legal button:hover {
  color: #fff;
}

/* =========================================================
   DATENSCHUTZ
========================================================= */

.privacy-content {
  max-width: 800px;
}

.privacy-content .section-intro {
  margin-bottom: 40px;
}

.privacy-meta {
  margin: 0 0 35px;

  color: #898681;

  font-size: 11px;
  letter-spacing: .05em;
}

.privacy-section {
  padding: 26px 0;

  border-top: 1px solid var(--line);
}

.privacy-section h2 {
  margin: 0 0 18px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: clamp(21px, 3vw, 29px);
  font-weight: normal;
  line-height: 1.4;
}

.privacy-section p {
  margin: 0 0 15px;

  color: #bdbab5;

  font-size: 14px;
  line-height: 1.9;

  overflow-wrap: anywhere;
}

.privacy-section p:last-child {
  margin-bottom: 0;
}

.privacy-section a {
  color: #e5e2de;
  text-decoration: underline;
  text-underline-offset: 4px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

  .language-switch {
    top: calc(18px + env(safe-area-inset-top));
    right: 20px;
  }

  /* SCENE 1 */

  .scene-intro {
    padding:
      calc(75px + env(safe-area-inset-top))
      20px
      calc(65px + env(safe-area-inset-bottom));
  }

  .brand {
    width: min(88vw, 430px);
  }

  .roles {
    width: 95%;
    margin-top: 34px;

    font-size: 9px;
    letter-spacing: .105em;
    line-height: 1.8;
  }

  /* SCENE 2 */

  .manifesto-image {
    inset: 0;
    width: 100%;
    height: 100%;
    object-position: center center;
    transform: none;
  }

  .manifesto-shade {
    background:
      linear-gradient(
        to bottom,
        rgba(0,0,0,.29) 0%,
        rgba(0,0,0,.04) 30%,
        rgba(0,0,0,.03) 60%,
        rgba(0,0,0,.34) 100%
      );
  }

  .theme-word {
    max-width: 56%;
    font-size: clamp(22px, 6.2vw, 31px);
  }

  .theme-word:nth-child(1) {
    top: 12%;
    left: 6%;
  }

  .theme-word:nth-child(2) {
    top: 25%;
    right: 6%;
  }

  .theme-word:nth-child(3) {
    top: 43%;
    left: 6%;
  }

  .theme-word:nth-child(4) {
    top: 65%;
    right: 6%;
  }

  .theme-word:nth-child(5) {
    left: 6%;
    bottom: 9%;
    max-width: 82%;

    font-size: clamp(20px, 5.3vw, 27px);
  }

  /* SCENE 3 */

  .scene-navigation {
    padding:
      calc(90px + env(safe-area-inset-top))
      22px
      calc(45px + env(safe-area-inset-bottom));
  }

  .navigation-intro {
    margin-bottom: 30px;
  }

  .main-nav button {
    padding: clamp(17px, 2.7vh, 24px) 0;

    font-size: clamp(30px, 10vw, 49px);
  }

  .main-nav button::after {
    font-size: 14px;
  }

  .home-footer {
    margin-top: 42px;

    flex-direction: column;
    align-items: flex-start;
    gap: 15px;
  }

  /* OVERLAY */

  .overlay {
    padding:
      calc(120px + env(safe-area-inset-top))
      20px
      calc(75px + env(safe-area-inset-bottom));
  }

  .close-overlay {
    right: 20px;
  }

  /* GENERAL CARDS */

  .cards {
    grid-template-columns: 1fr;
  }

  .card {
    min-height: 190px;
    padding: 25px;
  }

  /* ABOUT REMAINS THREE IN ONE ROW */

  .about-cards {
    grid-template-columns:
      repeat(3, minmax(0, 1fr));

    gap: 7px;
  }

  .about-cards .card {
    min-height: 195px;
    padding: 12px 8px;
  }

  .about-cards .card-number {
    font-size: 9px;
  }

  .about-cards .card-title {
    margin: 18px 0 10px;

    font-size: clamp(12px, 3.2vw, 17px);
    line-height: 1.2;

    overflow-wrap: anywhere;
  }

  .about-cards .card-description {
    font-size: 10px;
    line-height: 1.5;

    overflow-wrap: anywhere;
  }

  /* FILTERS */

  .primary-filters {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .primary-filters button {
    font-size: 10px;
  }

  /* PRIVACY */

  .privacy-section p {
    font-size: 13px;
    line-height: 1.85;
  }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation: none !important;
  }

  .theme-word {
    opacity: 1;
    transform: none;
  }
}

</style>
</head>

<body>

<!-- LANGUAGE -->

<div
  class="language-switch"
  aria-label="Language selection"
>
  <button
    type="button"
    data-lang="en"
    class="active"
  >EN</button>

  <button
    type="button"
    data-lang="de"
  >DE</button>

  <button
    type="button"
    data-lang="ru"
  >RU</button>
</div>

<!-- CLOSE OVERLAY -->

<button
  class="close-overlay"
  id="closeOverlay"
  type="button"
  aria-label="Close section"
>×</button>

<!-- ======================================================
     HOME — THREE SCENES
======================================================= -->

<main
  class="home"
  id="home"
>

  <!-- SCENE 01 -->

  <section
    class="scene scene-intro"
    id="sceneIntro"
  >

    <div class="brand">
      <img
        src="logo.PNG"
        alt="VARDAPET"
      >
    </div>

    <div
      class="roles"
      id="homeRoles"
    ></div>

    <div
      class="scroll-cue"
      aria-hidden="true"
    >
      <span id="scrollLabel">SCROLL</span>
      <span class="scroll-line"></span>
    </div>

  </section>

  <!-- SCENE 02 -->

  <section
    class="scene scene-manifesto"
    id="sceneManifesto"
    aria-label="VARDAPET artistic themes"
  >

    <img
      class="manifesto-image"
      src="bg.jpeg.PNG"
      alt=""
      aria-hidden="true"
    >

    <div
      class="manifesto-shade"
      aria-hidden="true"
    ></div>

    <div
      class="manifesto-vignette"
      aria-hidden="true"
    ></div>

    <div
      class="themes"
      id="homeThemes"
    ></div>

  </section>

  <!-- SCENE 03 -->

  <section
    class="scene scene-navigation"
    id="sceneNavigation"
  >

    <div
      class="navigation-intro"
      id="navigationIntro"
    >
      EXPLORE VARDAPET
    </div>

    <nav
      class="main-nav"
      id="mainNav"
      aria-label="Main navigation"
    ></nav>

    <footer class="home-footer">

      <div>© VARDAPET</div>

      <div class="footer-links">

        <button
          type="button"
          id="privacyFooter"
        ></button>

        <button
          type="button"
          id="imprintFooter"
        >
          Impressum
        </button>

      </div>

    </footer>

  </section>

</main>

<!-- ======================================================
     OVERLAY
======================================================= -->

<section
  class="overlay"
  id="overlay"
  role="dialog"
  aria-modal="true"
  aria-label="VARDAPET section"
>

  const node =
    document.createElement(tag);

  if (className) {
    node.className = className;
  }

  if (text !== undefined) {
    node.textContent = text;
  }

  return node;
}

/* =========================================================
   HOME
========================================================= */

function renderHome() {

  const data =
    CONTENT[currentLang];

  document.documentElement.lang =
    currentLang;

  document
    .getElementById("homeRoles")
    .textContent =
      data.roles;

  document
    .getElementById("scrollLabel")
    .textContent =
      data.scroll;

  document
    .getElementById("navigationIntro")
    .textContent =
      data.explore;

  /* THEMES */

  const themes =
    document.getElementById("homeThemes");

  themes.replaceChildren();

  data.themes.forEach(theme => {

      element(
        "span",
        "theme-word",
        theme
      )

  });

  /* MAIN NAV */

  nav.replaceChildren();

  ORDER.forEach(key => {

    const button =

        "button",

      );

  document.title =

    en:
      "VARDAPET — the independent artistic practice of Vardui Petrosyan. Direction, digital creation and cultural research.",

    de:
      "VARDAPET — die unabhängige künstlerische Praxis von Vardui Petrosyan. Regie, digitale Gestaltung und Kulturforschung.",

    ru:
      "VARDAPET — независимая художественная практика Вардуи Петросян. Режиссура, цифровое творчество и культурные исследования."
  };

  document
    .querySelector(

function addCards(

) {

  const grid =

  items.forEach(

            .padStart(2, "0")

/* =========================================================
   PORTFOLIO FILTERS
========================================================= */

function createFilterGroup(
  container,
  label,
  options,
  groupName
) {

  container.appendChild(
    element(
      "div",
      "filter-label",
      label
    )
  );

  const bar =
    element(
      "div",
      groupName === "role"
        ? "filter-bar primary-filters"
        : "filter-bar secondary-filters"
    );

  Object.entries(options)
    .forEach(([key, text]) => {

      const button =
        element(
          "button",
          "",
          text
        );

      button.type =
        "button";

      button.dataset.filter =
        key;

      button.dataset.group =
        groupName;

      button.addEventListener(
        "click",
        () => {

          if (
            groupName === "role"
          ) {

            currentRoleFilter =
              key;

          } else {

            currentTypeFilter =
              key;
          }

          applyPortfolioFilters();
        }
      );

      bar.appendChild(button);
    });

  container.appendChild(bar);
}

function applyPortfolioFilters() {

  let visibleCount = 0;

  overlay
    .querySelectorAll(
      ".portfolio-card"
    )
    .forEach(card => {

      const roles =
        card.dataset.roles.split(",");

      const type =
        card.dataset.type;

      const matchesRole =
        currentRoleFilter === "all" ||
        roles.includes(
          currentRoleFilter
        );

      const matchesType =
        currentTypeFilter === "all" ||
        type === currentTypeFilter;

      const visible =
        matchesRole &&
        matchesType;

      card.hidden =
        !visible;

      if (visible) {
        visibleCount++;
      }

    });

  overlay
    .querySelectorAll(
      ".filter-bar button"
    )
    .forEach(button => {

      const active =
        button.dataset.group === "role"
          ? button.dataset.filter === currentRoleFilter
          : button.dataset.filter === currentTypeFilter;

      button
        .classList
        .toggle(
          "active",
          active
        );

      button.setAttribute(
        "aria-pressed",
        String(active)
      );

    });

  const counter =
    document.getElementById(
      "portfolioResults"
    );

  if (counter) {

    counter.textContent =
      CONTENT[currentLang]
        .portfolio
        .results +
      ": " +
      visibleCount;
  }
}

function renderPortfolio(
  container,
  data
) {

  addHeader(
    container,
    data.kicker,
    data.title,
    data.intro
  );

  createFilterGroup(
    container,
    data.filterRoleLabel,
    data.roleFilters,
    "role"
  );

  createFilterGroup(
    container,
    data.filterTypeLabel,
    data.typeFilters,
    "type"
  );

  const counter =
    element(
      "div",
      "results-count"
    );

  counter.id =
    "portfolioResults";

  container.appendChild(counter);

  const grid =
    element(
      "div",
      "cards"
    );

  data.items.forEach(
    (item, index) => {

      const card =
        element(
          "article",
          "card portfolio-card"
        );

      card.dataset.roles =
        item.roles.join(",");

      card.dataset.type =
        item.type;

      card.appendChild(
        element(
          "div",
          "card-number",
          String(index + 1)
            .padStart(2, "0")
        )
      );

      const bottom =
        element("div");

      bottom.appendChild(
        element(
          "h2",
          "card-title",
          item.title
        )
      );

      bottom.appendChild(
        element(
          "p",
          "card-description",
          item.description
        )
      );

      if (item.status) {

        bottom.appendChild(
          element(
            "span",
            "project-status",
            item.status
          )
        );
      }

      card.appendChild(bottom);
      grid.appendChild(card);
    }
  );

  container.appendChild(grid);
}

/* =========================================================
   PRIVACY LINKS
========================================================= */

function appendPrivacyParagraph(
  container,
  text
) {

  const paragraph =
    element("p");

  const urlPattern =
    /(https?:\/\/[^\s]+)/g;

  const parts =
    text.split(urlPattern);

  parts.forEach(part => {

    if (
      /^https?:\/\//.test(part)
    ) {

      const link =
        element(
          "a",
          "",
          part
        );

      link.href =
        part;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

      paragraph.appendChild(link);

    } else if (
      part.includes(
        "petrosyanvardui@gmail.com"
      )
    ) {

      const segments =
        part.split(
          "petrosyanvardui@gmail.com"
        );

      segments.forEach(
        (segment, index) => {

          if (segment) {

            paragraph.appendChild(
              document.createTextNode(
                segment
              )
            );
          }

          if (
            index <
            segments.length - 1
          ) {

            const link =
              element(
                "a",
                "",
                "petrosyanvardui@gmail.com"
              );

            link.href =
              "mailto:petrosyanvardui@gmail.com";

            paragraph.appendChild(
              link
            );
          }
        }
      );

    } else {

      paragraph.appendChild(
        document.createTextNode(
          part
        )
      );
    }
  });

  container.appendChild(
    paragraph
  );
}

/* =========================================================
   PRIVACY
========================================================= */

function renderPrivacy(
  container,
  data
) {

  container.classList.add(
    "privacy-content"
  );

  addHeader(

    data.kicker,
    data.title,
    data.intro
  );

  container.appendChild(
    element(
      "div",
      "privacy-meta",
      data.updated
    )
  );

  data.sections.forEach(
    section => {

      const block =
        element(
          "section",
          "privacy-section"
        );

      block.appendChild(
        element(
          "h2",

          section.title
        )
      );

      section.paragraphs.forEach(
        paragraph => {

          appendPrivacyParagraph(

      );

      container.appendChild(

    }
  );
}

/* =========================================================
   RENDER SECTION
========================================================= */

function renderSection(key) {

  const data =
    CONTENT[currentLang][key];

  const container =
    document.createElement("div");

  if (
    key === "about"
  ) {

    renderAbout(
      container,
      data
    );

  } else if (
    key === "portfolio"
  ) {

    renderPortfolio(
      container,
      data
    );

  } else if (
    key === "contact"
  ) {

    renderContact(
      container,
      data
    );

  } else if (
    key === "privacy"
  ) {

    renderPrivacy(
      container,
      data
    );

  } else {

    addHeader(
      container,
      data.kicker,
      data.title,
      data.intro
    );

    addCards(
      container,
      data.cards
    );
  }

  overlayContent.replaceChildren(
    container
  );

  overlay.scrollTop =
    0;

  if (
    key === "privacy"
  ) {

    overlay.setAttribute(
      "aria-label",
      CONTENT[currentLang]
        .privacyLabel
    );

  } else {

    overlay.setAttribute(
      "aria-label",
      CONTENT[currentLang]
        .navigation[key]
    );
  }

  if (
    key === "portfolio"
  ) {

    applyPortfolioFilters();
  }
}

/* =========================================================
   OPEN / CLOSE
========================================================= */

function openSection(key) {

  if (
    ![
      ...ORDER,
      "privacy"
    ].includes(key)
  ) {
    return;
  }

  if (!currentSection) {

    previousFocus =
      document.activeElement;
  }

  currentSection =
    key;

  renderSection(key);

  overlay
    .classList
    .add("open");

  closeButton
    .classList
    .add("visible");

  document.body.style.overflow =
    "hidden";

  home.inert =
    true;

  closeButton.focus();
}

function closeSection() {

  overlay
    .classList
    .remove("open");

  closeButton
    .classList
    .remove("visible");

  document.body.style.overflow =
    "";

  home.inert =
    false;

  currentSection =
    null;

  if (
    previousFocus &&
    previousFocus.isConnected
  ) {

    previousFocus.focus();
  }

  previousFocus =
    null;
}

/* =========================================================
   LANGUAGE
========================================================= */

function changeLanguage(lang) {

  if (!CONTENT[lang]) {
    return;
  }

  currentLang =
    lang;

  renderHome();

  if (currentSection) {

    renderSection(
      currentSection
    );
  }
}

/* =========================================================
   LANGUAGE EVENTS
========================================================= */

document
  .querySelectorAll("[data-lang]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        changeLanguage(
          button.dataset.lang
        );
      }
    );
  });

/* =========================================================
   LEGAL EVENTS
========================================================= */

document
  .getElementById(
    "privacyFooter"
  )
  .addEventListener(
    "click",
    () => openSection("privacy")
  );

document
  .getElementById(
    "imprintFooter"
  )
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "impressum.html";
    }
  );

/* =========================================================
   CLOSE
========================================================= */

closeButton.addEventListener(
  "click",
  closeSection
);

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (!currentSection) {
      return;
    }

    if (
      event.key === "Escape"
    ) {

      closeSection();
      return;
    }

    if (
      event.key === "Tab"
    ) {

      const focusable = [

        ...document.querySelectorAll(
          ".language-switch button:not([disabled])"
        ),

        closeButton,

        ...overlay.querySelectorAll(
          'button:not([disabled]), a[href], input, select, textarea'
        )

      ].filter(
        node =>
          node.getClientRects()
            .length > 0
      );

      if (!focusable.length) {
        return;
      }

      const first =
        focusable[0];

      const last =
        focusable[
          focusable.length - 1
        ];

      if (
        event.shiftKey &&
        document.activeElement === first
      ) {

        event.preventDefault();
        last.focus();

      } else if (
        !event.shiftKey &&
        document.activeElement === last
      ) {

        event.preventDefault();
        first.focus();
      }
    }
  }
);

/* =========================================================
   INITIAL RENDER
========================================================= */

renderHome();

</script>
